[package]
name = "mass-spec-gym-mgf-conversion"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
description = "Convert GeMS-A10 HDF5 spectra into compressed MGF documents."
repository = "https://github.com/earth-metabolome-initiative/mass-spec-gym-mgf-conversion"
keywords = ["mass-spectrometry", "mgf", "hdf5", "gems"]
categories = ["science"]

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
csv = "1.4.0"
dotenvy = "0.15.7"
hdf5 = { package = "hdf5-metno", version = "0.12.4" }
hdf5-sys = { package = "hdf5-metno-sys", version = "0.11.3" }
indicatif = "0.18.4"
mass_spectrometry = { git = "https://github.com/earth-metabolome-initiative/mass-spectrometry-traits", rev = "33849cf912c9d2e6d13258f01593b7261e9f3c23", default-features = false, features = ["std"] }
mascot-rs = { git = "https://github.com/LucaCappelletti94/mascot-rs" }
ndarray = "0.17.2"
sha2 = "0.11.0"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
zenodo-rs = "0.1.6"
zstd = { version = "0.13.3", features = ["zstdmt"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.rust]
missing_docs = "deny"
warnings = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
decimal_literal_representation = "deny"
default_numeric_fallback = "deny"
empty_structs_with_brackets = "deny"
exhaustive_enums = "deny"
exhaustive_structs = "deny"
filetype_is_file = "deny"
float_cmp_const = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
host_endian_bytes = "deny"
impl_trait_in_params = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
integer_division_remainder_used = "deny"
iter_over_hash_type = "deny"
large_include_file = "deny"
large_stack_arrays = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
missing_docs_in_private_items = "deny"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
pathbuf_init_then_push = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
redundant_type_annotations = "deny"
same_name_method = "deny"
separated_literal_suffix = "deny"
string_lit_as_bytes = "deny"
string_slice = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
wildcard_enum_match_arm = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
multiple_crate_versions = "allow"
